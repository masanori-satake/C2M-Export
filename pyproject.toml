# プロジェクト共通のツール設定。
# mypy は ini 形式だと環境によっては cp932 で読まれ日本語コメントで失敗するため、
# UTF-8 前提で読まれる pyproject.toml 側に設定を集約する。

[tool.mypy]
python_version = "3.8"
# サードパーティライブラリ（型スタブのないもの）の import エラーを抑制する。
# 段階導入のため、まずは緩めの設定から始める。
ignore_missing_imports = true
# 安全に品質を上げるための警告
warn_unused_ignores = true
warn_redundant_casts = true
# 対象は本体パッケージ。テストは段階導入の対象外とする。
files = ["c2m_export"]
