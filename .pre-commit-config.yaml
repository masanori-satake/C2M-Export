repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-added-large-files
    # Python スクリプトの健全性チェック
    -   id: check-ast                # Python ファイルが構文的に妥当か（パース可能か）を確認
    -   id: check-merge-conflict     # マージコンフリクトの残骸を検出
    -   id: debug-statements         # pdb 等のデバッグ用ステートメントの残しを検出
    -   id: check-docstring-first    # docstring がコードより前に置かれているかを確認

# Ruff: 高速な Python リンター。
# 既存コードのスタイルを尊重し、バグに直結しやすいエラー系ルール（E9, F）に絞って有効化。
# 詳細な設定は ruff.toml を参照。
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.3
    hooks:
    -   id: ruff
        args: [--fix]
    # ruff-format: 一貫したコードフォーマットを自動適用（可読性・メンテナンス性向上）
    -   id: ruff-format

# mypy: 静的型検査。設定は mypy.ini を参照（段階導入のため緩めから開始）。
-   repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
    -   id: mypy
        # 型スタブを追加依存として渡す（pre-commit の隔離環境で必要）
        additional_dependencies: [types-requests, types-PyYAML]
        # 設定ファイルで対象（files=c2m_export）を制御するため、引数は付けない
        pass_filenames: false
