# Confluence to Markdown Exporter 設定サンプル
# このファイルを "c2m_config.yaml" にリネームして利用してください。

# ConfluenceのベースURL (例: https://your-domain/wiki)
# base_url: "https://confluence.example.com/wiki"

# 起点となるページのID
# 単一指定の例:
# root_page_ids: "12345678"
#
# 複数指定の例（推奨）:
root_page_ids:
  - "12345678"
  - "98765432"

# （分析モード用）起点となる Space キーのリスト
# space_keys:
#   - "SPACE_A"
#   - "SPACE_B"

# Bearerトークン
token: "your_bearer_token_here"

# 出力先ディレクトリ (既定: カレントディレクトリ)
output_dir: "."

# 出力ファイルの最大サイズ (MB) (既定: 100.0)
max_mb: 100.0

# 処理を停止する閾値 (MB) (既定: 95.0)
# このサイズを超えると新しいページの取得を停止します。
stop_threshold_mb: 95.0

# HTTP/HTTPS プロキシURL
# proxy: "http://proxy.example.com:8080"

# エクスポート結果をZip圧縮する (既定: false)
zip_output: false

# 既存の出力ファイルを上書きする (既定: false)
overwrite: false

# ==============================================================================
# 分析（アセスメント）モード固有の設定 (python -m c2m_export.assess で使用)
# ==============================================================================
assessment:
  # ページの個別アクセス制限（コンテンツ制限）を分析対象に含めるか (既定: true)
  analyze_restrictions: true

  # 巨大添付ファイルとして警告・検出する閾値 (MB) (既定: 250)
  single_file_max_mb: 250

  # パス長リスク検出の文字数上限 (既定: 400)
  path_length_limit: 400

  # ブロック対象の拡張子リスト (既定: exe, bat, cmd, sh, vbs, ps1, msi, com, scr, dll, sys, reg, jar)
  blocked_extensions:
    - exe
    - bat
    - cmd
    - sh
    - vbs
    - ps1
    - msi

  # パス長計算時に想定する添付ファイル格納サブフォルダ名 (既定: _attachments)
  attachment_dir_name: "_attachments"

  # 長期未更新ページとして集計する経過日数 (既定: 365)
  stale_days: 365

  # 本文が空/極小と判定するバイト数上限 (既定: 200)
  min_body_bytes: 200

  # 出力フォーマット: md, json, both (既定: both)
  report_format: "both"

# ==============================================================================
# ファイルシステムモード固有の設定 (python -m c2m_export.fsexport で使用)
# ==============================================================================
filesystem_export:
  # 添付ファイルを格納するサブディレクトリ名 (既定: _attachments)
  attachment_dir_name: "_attachments"

  # 本文中の添付参照のリンク書き換えモード: relative (相対パス), original (Confluence絶対URL) (既定: relative)
  attachment_link_mode: "relative"

  # ページ本文ファイル命名方式: title (ページタイトル由来), index (固定 index.md) (既定: title)
  page_filename_mode: "title"

  # 単一添付ファイルの最大保存サイズ上限 (MB) (既定: 250)
  single_file_max_mb: 250

  # 保存をスキップする添付拡張子のリスト
  # exclude_extensions:
  #   - zip
  #   - exe

  # パス長警告のしきい値 (既定: 400)
  path_length_limit: 400

  # Frontmatter に出力するメタデータフィールドの選択
  # frontmatter_fields:
  #   - confluence_url
  #   - confluence_page_id
  #   - confluence_space_key
  #   - title
  #   - version
  #   - last_modified
  #   - exported_at
