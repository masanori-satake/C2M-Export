# Confluence to Markdown Exporter 設定サンプル
# このファイルを "c2m_config.yaml" にリネームして利用してください。

# ConfluenceのベースURL (例: https://your-domain/wiki)
# base_url: "https://confluence.example.com/wiki"

# 起点となるページのID
# 単一指定の例:
# root_page_ids: "12345678"
#
# 複数指定の例（推奨）:
root_page_ids:
  - "12345678"
  - "98765432"

# （分析モード用）起点となる Space キーのリスト
# space_keys:
#   - "SPACE_A"
#   - "SPACE_B"

# Bearerトークン
token: "your_bearer_token_here"

# 出力先ディレクトリ (既定: カレントディレクトリ)
output_dir: "."

# 出力ファイルの最大サイズ (MB) (既定: 100.0)
max_mb: 100.0

# 処理を停止する閾値 (MB) (既定: 95.0)
# このサイズを超えると新しいページの取得を停止します。
stop_threshold_mb: 95.0

# HTTP/HTTPS プロキシURL
# proxy: "http://proxy.example.com:8080"

# エクスポート結果をZip圧縮する (既定: false)
zip_output: false

# 既存の出力ファイルを上書きする (既定: false)
overwrite: false

# ==============================================================================
# 分析 CLI モード固有の設定 (python -m c2m_export.analyze で使用)
# ==============================================================================
analysis:
  # 実行する分析ユースケース (risk, stale, restricted, archives, empty_with_attachments, macros)
  # usecases:
  #   - risk
  #   - stale
  #   - restricted
  #   - archives
  #   - empty_with_attachments
  #   - macros

  # 出力モード: summary (集計サマリのみ), detail (個別一覧含む) (既定: summary)
  mode: "summary"

  # detail モード時の個別項目抽出上限件数 (既定: 1000)
  limit: 1000

  # 長期未更新ページとして集計する経過日数 (既定: 365)
  stale_days: 365

  # 本文が空/極小と判定するバイト数上限 (既定: 200)
  min_body_bytes: 200

  # 圧縮形式カテゴリとみなす拡張子リスト
  archive_extensions:
    - zip
    - 7z
    - rar
    - gz
    - tar
    - bz2
    - xz
    - tgz
    - lzh
    - cab

  # ページのアクセス制限（権限）情報を分析収集するか (既定: true)
  analyze_restrictions: true

  # 参照可能な全 Space を起点として分析するか (既定: false)
  # all_spaces: false

  # 起点検索用または課題抽出用の CQL 条件文字列
  # cql: "space = 'SPACE_A' AND title ~ '設計'"

  # 詳細調査フェーズの情報を一括で有効化するか (既定: false)
  # deep: false

  # 詳細調査情報の個別収集フラグ (deep が true の場合は個別に false 指定で無効化可能)
  # collect_history: true
  # collect_labels: true
  # collect_comments: true
  # collect_watchers: true
  # collect_effective_restrictions: true
  # collect_extracted_text: true
  # collect_space_permissions: true

# ==============================================================================
# 分析（アセスメント）モード固有の設定 (python -m c2m_export.assess で使用)
# ==============================================================================
assessment:
  # ページの個別アクセス制限（コンテンツ制限）を分析対象に含めるか (既定: true)
  analyze_restrictions: true

  # 巨大添付ファイルとして警告・検出する閾値 (MB) (既定: 250)
  single_file_max_mb: 250

  # パス長リスク検出の文字数上限 (既定: 400)
  path_length_limit: 400

  # ブロック対象の拡張子リスト (既定: exe, bat, cmd, sh, vbs, ps1, msi, com, scr, dll, sys, reg, jar)
  blocked_extensions:
    - exe
    - bat
    - cmd
    - sh
    - vbs
    - ps1
    - msi

  # パス長計算時に想定する添付ファイル格納サブフォルダ名 (既定: _attachments)
  attachment_dir_name: "_attachments"

  # 長期未更新ページとして集計する経過日数 (既定: 365)
  stale_days: 365

  # 本文が空/極小と判定するバイト数上限 (既定: 200)
  min_body_bytes: 200

  # 出力フォーマット: md, json, both (既定: both)
  report_format: "both"

# ==============================================================================
# ファイルシステムモード固有の設定 (python -m c2m_export.fsexport で使用)
# ==============================================================================
filesystem_export:
  # 添付ファイルを格納するサブディレクトリ名 (既定: _attachments)
  attachment_dir_name: "_attachments"

  # 本文中の添付参照のリンク書き換えモード: relative (相対パス), original (Confluence絶対URL) (既定: relative)
  attachment_link_mode: "relative"

  # ページ本文ファイル命名方式: title (ページタイトル由来), index (固定 index.md) (既定: title)
  page_filename_mode: "title"

  # 単一添付ファイルの最大保存サイズ上限 (MB) (既定: 250)
  single_file_max_mb: 250

  # 保存をスキップする添付拡張子のリスト
  # exclude_extensions:
  #   - zip
  #   - exe

  # パス長警告のしきい値 (既定: 400)
  path_length_limit: 400

  # Frontmatter に出力するメタデータフィールドの選択
  # frontmatter_fields:
  #   - confluence_url
  #   - confluence_page_id
  #   - confluence_space_key
  #   - title
  #   - version
  #   - last_modified
  #   - exported_at

  # 差分同期を有効化する (既定: false)
  # sync: true

  # 中断からのレジューム再開を有効化する (既定: false)
  # resume: true

  # マニフェストを無視して全件フル再取得する (既定: false)
  # full: false

  # 削除同期の方針: quarantine (退避ディレクトリへ移動), delete (物理削除), report (報告のみ) (既定: quarantine)
  # deletion_policy: "quarantine"

  # 退避ディレクトリ名 (既定: _c2m_quarantine)
  # quarantine_dir_name: "_c2m_quarantine"

# ==============================================================================
# 権限エクスポートモード固有の設定 (python -m c2m_export.permexport で使用)
# ==============================================================================
permission_export:
  # レポートの格納形態: aggregate (トップレベル直下に集約), per_page (各ページディレクトリに分散) (既定: aggregate)
  report_layout: "aggregate"

  # レポートの出力フォーマット: md, json, both (既定: md)
  report_formats: "md"

  # 添付サブディレクトリ名 (per_page 時の相対パス整合用) (既定: _attachments)
  attachment_dir_name: "_attachments"

  # ページ本文ファイル命名方式 (per_page 時の相対パス整合用) (既定: title)
  page_filename_mode: "title"

# ==============================================================================
# ページツリー可視化モード固有の設定 (python -m c2m_export.tree で使用)
# ==============================================================================
tree:
  # 出力フォーマット: text (罫線ツリー), markdown (箇条書きツリー + 別表), json (構造化データ) (既定: text)
  format: "text"

  # 取得・表示する付帯情報リスト (restriction, macros, attachments, last_modified)
  # include:
  #   - restriction
  #   - macros
  #   - attachments
  #   - last_modified

  # 文字化け防止用 ASCII 互換マークを使用するか (既定: false)
  ascii: false

  # 探索する最大階層深さ (指定なし/0で無制限)
  # max_depth: 3
